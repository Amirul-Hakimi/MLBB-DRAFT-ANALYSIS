<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Draft Tool | Tournament Simulator</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation / Header -->
        <header class="navbar">
            <div class="logo">MLBB <span>DRAFT TOOL</span></div>
            <div id="connection-status" class="status-badge disconnected">Offline</div>
        </header>

        <!-- Main Screen: Room Setup / Landing View -->
        <main id="setup-screen" class="screen active">
            <div class="hero-section">
                <h1>Tournament Ban/Pick Simulator</h1>
                <p>Rehearse competitive drafts or play live head-to-head multiplayer.</p>
            </div>

            <div class="card setup-card">
                <h2>Lobby Options</h2>
                
                <!-- Action Tabs -->
                <div class="btn-group">
                    <button id="btn-mode-create" class="btn btn-primary">Create Room</button>
                    <button id="btn-mode-join" class="btn btn-secondary">Join Room</button>
                </div>

                <!-- Join Room Input (Hidden by default) -->
                <div id="join-input-group" class="input-group hidden">
                    <label for="room-id-input">Enter 6-Character Room ID:</label>
                    <input type="text" id="room-id-input" placeholder="e.g. ROOM99" maxlength="6">
                </div>

                <!-- Team Side Selection -->
                <div class="team-selection">
                    <h3>Select Your Side</h3>
                    <div class="side-picker">
                        <label class="radio-card">
                            <input type="radio" name="team-side" value="blue" checked>
                            <span class="side-label blue-side">Blue Team (First Pick)</span>
                        </label>
                        <label class="radio-card">
                            <input type="radio" name="team-side" value="red">
                            <span class="side-label red-side">Red Team (Second Pick)</span>
                        </label>
                    </div>
                </div>

                <!-- Enter Lobby Action Button -->
                <button id="btn-enter-room" class="btn btn-success btn-large">Enter Draft Room</button>
            </div>
        </main>

        <!-- Draft Screen -->
<section id="draft-screen" class="screen hidden">
    <!-- Turn Banner & Status -->
    <div class="draft-header">
        <div class="team-banner blue-team" id="team-a-box">
            <h2>Blue Team (A)</h2>
            <div id="blue-bans" class="bans-list">Bans: </div>
            <ul id="blue-picks" class="picks-list"></ul>
        </div>

        <div class="draft-status-center">
            <div id="room-display-tag" class="room-tag">ROOM: ----</div>
            <div id="turn-banner-text" class="turn-banner">Turn 1: Team A Ban</div>
            <div id="phase-banner-text" class="phase-subtext">Ban Phase 1</div>
        </div>

        <div class="team-banner red-team" id="team-b-box">
            <h2>Red Team (B)</h2>
            <div id="red-bans" class="bans-list">Bans: </div>
            <ul id="red-picks" class="picks-list"></ul>
        </div>
    </div>

    <!-- Controls: Search & Filters -->
    <div class="filter-bar">
        <input type="text" id="hero-search" placeholder="Search hero by name..." />
        <div class="lane-tabs">
            <button class="lane-btn active" data-lane="ALL">ALL</button>
            <button class="lane-btn" data-lane="EXP">EXP</button>
            <button class="lane-btn" data-lane="Jungle">Jungle</button>
            <button class="lane-btn" data-lane="Mid">Mid</button>
            <button class="lane-btn" data-lane="Gold">Gold</button>
            <button class="lane-btn" data-lane="Roam">Roam</button>
        </div>
    </div>

    <!-- Hero Grid Container -->
    <div id="hero-grid" class="hero-grid"></div>

    <div class="action-footer">
        <button id="btn-leave-room" class="btn btn-danger">Reset & Leave</button>
    </div>
</section>
    </div>

    <!-- External JavaScript File -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/hero-data.js"></script>
    <script src="/js/draft-engine.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
